<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MTG Match Tracker</title>
  <meta name="description" content="Track turns, steps, priority, the stack and life totals in a two-player Magic: The Gathering match.">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- iOS home-screen app: full-bleed, status bar over the black background -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MTG Tracker">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preload" href="fonts/roboto-condensed-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/mana/css/mana.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="table" id="table">
    <!-- Player 2 sits across the table: their half is rotated 180° -->
    <section class="player" data-p="1" aria-label="Player 2"></section>
    <section class="player" data-p="0" aria-label="Player 1"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
