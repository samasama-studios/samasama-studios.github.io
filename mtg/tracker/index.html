<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MTG Match Tracker</title>
  <meta name="description" content="Track turns, steps, priority, the stack and life totals in a two-player Magic: The Gathering match.">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- iOS home-screen app: full-bleed, status bar over the black background -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MTG Tracker">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preload" href="fonts/roboto-condensed-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/mana/css/mana.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="table" id="table">
    <!-- Player 2 sits across the table: their half is rotated 180° -->
    <section class="player" data-p="1" aria-label="Player 2"></section>
    <section class="player" data-p="0" aria-label="Player 1"></section>
    <!-- Mirrors the life bar grid so the gear sits opposite the priority badge, on the divider -->
    <div class="divider-overlay">
      <button class="gear-btn" id="gear-btn" aria-label="Game menu" aria-haspopup="dialog"></button>
    </div>
  </main>

  <dialog class="menu" id="menu" aria-labelledby="menu-title" autofocus>
    <h2 class="menu-title" id="menu-title">Game</h2>
    <button class="menu-btn" id="revert-btn">
      <span class="menu-btn-label">Revert last step</span>
      <span class="menu-btn-sub" id="revert-sub"></span>
    </button>
    <button class="menu-btn danger" id="reset-btn">
      <span class="menu-btn-label" id="reset-label">Reset game</span>
      <span class="menu-btn-sub" id="reset-sub">Steps, priority, stack and life</span>
    </button>
    <button class="menu-close" id="menu-close">Close</button>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
