<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9E5DB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10171E" media="(prefers-color-scheme: dark)">
<title>Cronología del conflicto del Atlántico Sur</title>
<style>
:root{
  --paper:#E9E5DB; --land:#D9D2C0; --ink:#1B2733; --ink-soft:#5A6672; --rule:#B9B2A0;
  --ar:#2C5FA8; --uk:#A8482C; --neutral:#7A7669; --panel:#F2EFE7;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#10171E; --land:#1F2A34; --ink:#DCD7CA; --ink-soft:#98A2AC; --rule:#33404B;
         --ar:#78ABE4; --uk:#E08B6C; --neutral:#8C9198; --panel:#17202A; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  font-size:17px; line-height:1.55;
  -webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:1100px;margin:0 auto;padding:20px 18px 32px}
header{border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:14px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:.01em}
header p{margin:4px 0 0;font-size:14px;color:var(--ink-soft)}
.chart{border:1px solid var(--rule);background:var(--paper);border-radius:2px;overflow:hidden;touch-action:pan-y}
svg{display:block;width:100%;height:auto;max-height:58vh}
.panel{position:relative;margin-top:14px;background:var(--panel);border:1px solid var(--rule);border-radius:2px;padding:14px 16px;min-height:150px}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;min-height:38px}
.date{font-size:18px;font-weight:600}
.side{font-size:13px;letter-spacing:.02em;border-bottom:2px solid currentColor;padding-bottom:1px}
.flagbox{display:inline-flex;align-items:center;line-height:0}
.warn{min-width:0;min-height:34px;padding:3px 9px;gap:6px;align-items:center;border-color:var(--uk);color:var(--uk);font-size:16px;line-height:1}
.warn[hidden]{display:none}
.warn svg{outline:1px solid var(--rule)}
#ukpop{position:absolute;left:14px;right:14px;top:56px;z-index:5;background:var(--panel);border:1px solid var(--uk);border-left:4px solid var(--uk);border-radius:2px;padding:11px 13px;font-size:15.5px;line-height:1.5}
#ukpop[hidden]{display:none}
#ukpop b{display:block;font-size:13px;color:var(--ink-soft);font-weight:400;margin-bottom:4px}
.dates .w{flex:0 0 auto;color:var(--uk);font-size:15px}
.dates .wa{flex:0 0 auto;color:var(--ar);font-size:15px}
.warn.arn{border-color:var(--ar);color:var(--ar)}
#ukpop.arn{border-color:var(--ar);border-left-color:var(--ar)}
.flagbox svg{outline:1px solid var(--rule)}
.txt{margin:0;font-size:16.5px;color:var(--ink)}
.controls{display:flex;align-items:center;gap:12px;margin-top:14px}
button{
  font:inherit;font-size:16px;color:var(--ink);background:transparent;
  border:1px solid var(--rule);border-radius:2px;
  min-width:52px;min-height:48px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
button:active{background:var(--land)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ar);outline-offset:2px}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;height:48px;background:transparent;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--rule)}
input[type=range]::-moz-range-track{height:2px;background:var(--rule)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--ink);margin-top:-10px}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--ink)}
.dates{margin-top:18px;border-top:1px solid var(--rule);padding-top:12px}
.dates ol{list-style:none;margin:0;padding:0}
.dates li{border-bottom:1px solid var(--rule)}
.dates button{
  width:100%;min-height:44px;justify-content:flex-start;text-align:left;
  border:0;border-left:3px solid transparent;padding:9px 10px;font-size:15px;gap:10px;
}
.dates button[aria-current=true]{border-left-color:var(--ink);background:var(--panel);font-weight:600}
.dates .d{flex:0 0 104px;color:var(--ink-soft)}
.dates .s{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
footer{margin-top:22px;font-size:13px;color:var(--ink-soft)}
@media (min-width:860px){
  .cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,1fr);gap:24px;align-items:start}
  svg{max-height:56vh}
  .controls{margin-top:0}
  .dates{max-height:72vh;overflow:auto}
}
@media (prefers-reduced-motion:no-preference){
  .pulse{animation:p 1.8s ease-out infinite}
  @keyframes p{0%{r:8;opacity:.9}100%{r:18;opacity:0}}
}
</style>
</head>

        <path d="M360,40 L356,24 L368,8 L380,24 L384,36 Z"/>
      </g>
      <g id="pol"></g>
      <g id="statics"></g>
      <g id="tracks" fill="none" stroke-linecap="round"></g>
      <g id="dots"></g>
    </svg>
  </div>

    <div class="panel">
      <div class="meta">
        <span class="date" id="date">—</span>
        <span class="flagbox" id="pflag" aria-hidden="true"></span>
        <span class="side" id="side">—</span>
        <button class="warn" id="uknote" hidden aria-expanded="false"><span id="ukflag" aria-hidden="true"></span><span aria-hidden="true">!</span><span class="sr">Ver la versión británica</span></button><button class="warn arn" id="arnote" hidden aria-expanded="false"><span id="arflag" aria-hidden="true"></span><span aria-hidden="true">!</span><span class="sr">Ver la objeción argentina</span></button>
      </div>
      <div id="ukpop" hidden role="note"><b id="popttl"></b><span id="uktxt"></span></div>
      <p class="txt" id="txt">—</p>
    </div>
  </div>

  <div class="side-col">
    <div class="controls">
      <button id="prev" aria-label="Evento anterior">&#8249;</button>
      <button id="play" aria-label="Reproducir la secuencia"><span id="pi">&#9654;</span></button>
      <button id="next" aria-label="Evento siguiente">&#8250;</button>
      <input type="range" id="sl" min="0" max="39" step="1" value="0" aria-label="Línea de tiempo">
    </div>

    <nav class="dates" aria-label="Todos los eventos">
      <ol id="list"></ol>
    </nav>
  </div>
</div>

<footer>Deslizá sobre el mapa o usá las flechas del teclado para avanzar. Los signos <span style="color:var(--uk)">!</span> y <span style="color:var(--ar)">!</span> marcan los puntos que el relato británico o el argentino no dan por buenos.</footer>
</div>

var E=[
 {d:"Antes de 1500",s:"ne",n:"Sin población estable",r:"Islas deshabitadas",fl:[],ic:["isle"],f:"malvinas",k:[["fuego","malvinas","ne"]],
  t:"Las islas no tenían población permanente. Un estudio de 2021 halló en New Island carbón de fogatas, grandes acumulaciones de huesos de lobos marinos y pingüinos y una punta de proyectil de cuarcita local, todo anterior a los europeos: probables visitas en canoa de yaganes (yámana) desde Tierra del Fuego. El warrah, zorro-lobo que era el único mamífero terrestre nativo, pudo haber llegado con ellos; se extinguió hacia 1876."},

  uk:"Londres no acepta ninguno de esos avistamientos como probado y sostiene que el primero verificable es el de John Davis en 1592."},

  t:"John Davis, con el Desire, avista las islas al ser empujado hacia el este por un temporal. Dos años después Richard Hawkins recorre la costa norte. Es el hecho en el que Gran Bretaña funda su derecho de descubrimiento."},
 {d:"1600",s:"ne",n:"Provincias Unidas neerlandesas",r:"Sebald de Weert",fl:["nl"],f:"malvinas",k:[["rotterdam","malvinas","ne"]],

 {d:"1690",ar:"Para la posición argentina, Strong solo desembarcó y puso un nombre: no fundó nada ni realizó acto formal de posesión, y Gran Bretaña no volvió al archipiélago hasta 75 años después.",s:"en",r:"Primer desembarco",fl:["en"],f:"malvinas",k:[["plymouth","malvinas","en"]],ic:["ship"],
  t:"John Strong hace el primer desembarco registrado y bautiza Falkland Sound al canal entre las dos islas mayores, en honor al vizconde de Falkland. El nombre pasaría después a todo el archipiélago."},
 {d:"1700–1712",s:"ne",n:"Francia",r:"Los malouins",fl:["fr"],f:"malvinas",k:[["saintmalo","malvinas","ne"]],ic:["ship"],
  t:"Durante la guerra de Sucesión española, armadores de Saint-Malo consiguen permiso para comerciar con Chile y Perú por el cabo de Hornos. Sus barcos pasan una y otra vez junto al archipiélago: Beauchesne-Gouin avista en 1701 la isla que hoy lleva su nombre y hacia 1705 se cartografían otros islotes. Son esos malouins los que terminarán dando nombre a las islas."},
 {d:"1713",s:"ne",n:"España y Reino Unido",r:"Tratado de Utrecht",fl:["es","uk"],fo:[-40,-30],f:"malvinas",k:[],ic:["council"],
  t:"El Tratado de Utrecht cierra la guerra y confirma las posesiones españolas en América del Sur. Madrid, y más tarde Buenos Aires, lo leen como el reconocimiento del dominio exclusivo español en el Atlántico Sur, islas incluidas.",
  uk:"Londres rechaza esa lectura: Utrecht no menciona las islas, no reconoce un derecho exclusivo sobre territorios que nadie ocupaba, y Gran Bretaña nunca aceptó el reparto del Tratado de Tordesillas."},
 {d:"1716–1722",s:"ne",n:"Francia",r:"Nace el nombre Malvinas",fl:["fr"],f:"malvinas",k:[],ic:["isle"],
  t:"Frézier publica en 1716 una carta que las llama Isles Nouvelles, descubiertas por los navíos de Saint-Malo desde 1700. En 1721 el neerlandés Roggeveen las bautiza Belgia Austral, nombre que no prende. En 1722 el cartógrafo Delisle fija Îles Malouines; el español lo convierte en Malvinas y así quedan en las cartas."},
 {d:"1749",s:"uk",r:"El plan de Anson",fl:["uk"],f:"malvinas",k:[],ic:["council"],
  t:"De vuelta de su circunnavegación, el almirante Anson informa que las islas serían la base ideal para operar en el Pacífico. En 1749 el Almirantazgo prepara una expedición para reconocerlas y establecerse. España protesta con dureza y Londres desiste, aunque sin admitir el reclamo español.",
  ar:"Buenos Aires lee el episodio al revés que Londres: ante la protesta española Gran Bretaña abandonó el proyecto, es decir, se abstuvo de ocupar un territorio cuyo dominio español no estaba en condiciones de discutir en los hechos."},
 {d:"1764",s:"ne",n:"Francia",r:"Port Louis",fl:["fr"],f:"malvinas",k:[["saintmalo","malvinas","ne"]],ic:["settle"],
  t:"Tras perder Canadá en la Guerra de los Siete Años, Bougainville propone a la corona un establecimiento que asegure a Francia el paso al Pacífico. Zarpa de Saint-Malo el 15 de septiembre de 1763 con la fragata L\u0027Aigle y la corbeta Le Sphinx y unos 150 colonos, entre ellos familias acadianas expulsadas de Canadá. Toca tierra en febrero de 1764 y el 5 de abril toma posesión formal: Port Louis es el primer asentamiento estable de las islas."},
 {d:"1765",ar:"Buenos Aires lo considera un establecimiento clandestino: Byron actuó en secreto sobre un archipiélago que Francia ya ocupaba y que España reclamaba por los tratados vigentes, y España protestó apenas lo supo.",s:"uk",r:"Port Egmont",fl:["uk"],f:"malvinas",k:[["plymouth","malvinas","uk"]],ic:["settle"],
  t:"John Byron toma posesión en nombre de Jorge III en la isla Trinidad (Saunders) y al año siguiente McBride funda allí Port Egmont. Durante meses ninguna de las dos potencias supo de la presencia de la otra."},
 {d:"1767",s:"ne",n:"Francia y España",r:"España compra la colonia",fl:["fr","es"],fo:[-40,-30],f:"malvinas",k:[],ic:["council"],
  t:"Francia entrega Port Louis a España, que compensa a Bougainville, rebautiza el lugar Puerto Soledad y lo administra desde Buenos Aires."},
 {d:"1770",uk:"Para Londres fue un ataque por sorpresa contra un establecimiento británico legítimo, reparado al año siguiente con la devolución del puerto.",s:"ne",n:"España",r:"Expulsión de Port Egmont",fl:["es"],f:"malvinas",k:[["buenosaires","malvinas","ne"]],ic:["fire"],
  t:"Una escuadra española de cinco naves y unos 1.400 hombres obliga a la guarnición británica a dejar Port Egmont. Tras unos disparos simbólicos los británicos capitulan; no hubo muertos. El incidente lleva a España y Gran Bretaña al borde de la guerra."},
 {d:"1771",ar:"Buenos Aires sostiene que la devolución vino acompañada de una promesa reservada de que Gran Bretaña se retiraría después, cumplida en 1774.",s:"ne",n:"España y Reino Unido",r:"Port Egmont restituido",fl:["es","uk"],fo:[-40,-30],f:"malvinas",k:[],ic:["council"],
  t:"Por un canje de declaraciones España devuelve Port Egmont a Gran Bretaña, dejando expresamente a salvo la cuestión de fondo de la soberanía.",

 {d:"1774",ar:"Para Buenos Aires equivalió a renunciar al reclamo: siguieron 55 años sin presencia ni actos de gobierno británicos, frente a casi cuatro décadas de presencia española continua.",s:"uk",r:"Retiro británico",fl:["uk"],f:"malvinas",k:[["malvinas","plymouth","uk"]],ic:["settle"],
  t:"Gran Bretaña abandona Port Egmont dentro de un recorte general de guarniciones de ultramar y deja una placa de plomo declarando las islas propiedad británica.",
  uk:"Para Londres fue un repliegue dentro de un recorte general de guarniciones, que no invalidó sus derechos: la placa de plomo lo dejaba asentado por escrito."},
 {d:"1776",s:"ne",n:"España",r:"Virreinato del Río de la Plata",fl:["es"],f:"malvinas",k:[],ic:["council"],
  t:"España crea el Virreinato del Río de la Plata con capital en Buenos Aires. Puerto Soledad queda bajo su jurisdicción: entre 1767 y 1811 se suceden allí una treintena de gobernadores nombrados desde Buenos Aires, con guarnición, capilla y presidio.",

 {d:"1811",s:"ne",n:"España",r:"España se retira",fl:["es"],f:"malvinas",k:[],ic:["settle"],

 {d:"1820",ar:"La respuesta argentina es que el acto fue público: Jewett lo comunicó a los barcos fondeados, se publicó en la prensa de Estados Unidos e Inglaterra al año siguiente y Gran Bretaña no protestó entonces.",s:"ar",r:"Jewett iza la bandera",fl:["ar"],f:"malvinas",k:[["buenosaires","malvinas","ar"]],ic:["council"],
  t:"El coronel David Jewett, al mando de la Heroína, entra a Puerto Soledad a reparar la nave y el 6 de noviembre iza la bandera de las Provincias Unidas del Río de la Plata tomando posesión de las islas.",
  uk:"Londres no reconoce ese acto: Jewett llegó como corsario en apuros, con la tripulación diezmada y entre medio centenar de balleneros británicos y estadounidenses fondeados allí; no dejó ocupación efectiva y Buenos Aires no difundió el acto hasta tiempo después."},
 {d:"1828",ar:"Buenos Aires responde que Vernet gestionó como particular y que tanto la concesión de tierras como el mando se los dio el gobierno de Buenos Aires, el único que ejercía autoridad allí desde 1811.",s:"ar",r:"Colonia de Vernet",fl:["ar"],f:"malvinas",k:[],ic:["settle"],

  uk:"El consulado británico protestó formalmente el nombramiento de 1829. Londres agrega que Vernet había pedido antes autorización y protección británicas para instalarse, lo que a su juicio suponía reconocer el derecho británico."},
 {d:"dic 1831",ar:"Argentina sostiene que Vernet actuaba con autoridad legítima al hacer cumplir la veda de caza, considera la incursión del Lexington un acto de agresión y reclamó reparaciones a Estados Unidos durante décadas.",s:"ne",n:"Estados Unidos",r:"Incursión del Lexington",fl:["us"],f:"malvinas",k:[["montevideo","malvinas","ne"]],ic:["fire"],
  t:"Vernet había capturado tres balleneros estadounidenses por cazar sin permiso. En represalia la corbeta USS Lexington desmantela el asentamiento de Puerto Luis, detiene a varios colonos acusados de piratería y declara las islas libres de todo gobierno."},

    g.appendChild(el("path",{d:"M8,10.4 L8,2.4",stroke:col,"stroke-width":1.1}));
    g.appendChild(el("path",{d:"M8.9,3 L12.9,6.2 L8.9,8 Z",fill:col}));
  }
  return g;
}
var TR=document.getElementById("tracks"),DT=document.getElementById("dots"),
    SL=document.getElementById("sl"),LI=document.getElementById("list");
var i=0,timer=null;

E.forEach(function(e,n){
  var li=document.createElement("li"),b=document.createElement("button");
  b.innerHTML='<span class="d"></span><span class="s"></span>'+(e.uk?'<span class="w" aria-hidden="true">!</span>':'')+(e.ar?'<span class="wa" aria-hidden="true">!</span>':'');
  b.querySelector(".d").textContent=e.d;
  b.querySelector(".s").textContent=e.r;
  b.onclick=function(){stop();go(n)};
  li.appendChild(b);LI.appendChild(li);
});
(function(){var y=0;E.forEach(function(e){
  if(/Antes/.test(e.d))y=1400;else{var m=e.d.match(/\d{4}/);if(m)y=+m[0];}
  e.y=y;});})();
var LB=LI.querySelectorAll("button");
SL.max=E.length-1;

var CTRL=document.querySelector(".controls"),STAGE=document.querySelector(".stage"),
    SIDE=document.querySelector(".side-col"),PANEL=document.querySelector(".panel"),
    WIDE=window.matchMedia("(min-width:860px)");
function place(){
  if(WIDE.matches){if(CTRL.parentNode!==SIDE)SIDE.insertBefore(CTRL,SIDE.firstChild)}
  else if(CTRL.parentNode!==STAGE)STAGE.insertBefore(CTRL,PANEL);
}
place();
if(WIDE.addEventListener)WIDE.addEventListener("change",place);
else if(WIDE.addListener)WIDE.addListener(place);
var NAVL=document.querySelector(".dates");
function reveal(b){
  if(!NAVL||NAVL.scrollHeight<=NAVL.clientHeight+2)return;
  var nb=NAVL.getBoundingClientRect(),bb=b.getBoundingClientRect();
  if(bb.top<nb.top)NAVL.scrollTop+=bb.top-nb.top-8;
  else if(bb.bottom>nb.bottom)NAVL.scrollTop+=bb.bottom-nb.bottom+8;
}
function putIcon(kind,x,y,col){
  var nd=iconNode(kind,col);
  nd.setAttribute("transform","translate("+(x-8*K)+","+(y-8*K)+") scale("+K+")");
  DT.appendChild(nd);
}
function draw(){
  var pts=[P[E[i].f]];
  E[i].k.forEach(function(k){pts.push(P[k[0]]);pts.push(P[k[1]]);
    var w=WAY[k[0]+">"+k[1]];if(w)pts=pts.concat(w);});
  var box=fit(pts);
  if(!similar(box,VB))setView(box);
  politics();
  drawStatics();
  TR.textContent="";DT.textContent="";
  var legs=[];
  for(var n=0;n<=i;n++){
    var cur=n===i;
    E[n].k.forEach(function(k){
      var pe=el("path",{d:routeD(k),fill:"none",stroke:C[k[2]],
        "stroke-width":(cur?2.2:1)*K,"stroke-opacity":cur?1:0.3,
        "stroke-dasharray":cur?"none":(4*K)+" "+(5*K),
        "marker-end":"url(#a"+(k[2]==="ar"?"AR":(k[2]==="ne"?"NE":"UK"))+(cur?"":"d")+")"});
      TR.appendChild(pe);
      if(cur)legs.push([pe,k]);
      var o=P[k[0]];
      DT.appendChild(el("circle",{cx:o[0],cy:o[1],r:(cur?3.2:2.2)*K,fill:C[k[2]],"fill-opacity":cur?1:0.35}));
    });
    if(cur){
      var f=P[E[n].f];
      var rg=el("g",{transform:"translate("+f[0]+","+f[1]+") scale("+K+")"});
      rg.appendChild(el("circle",{"class":"pulse",cx:0,cy:0,r:8,fill:"none",stroke:C[E[n].s],"stroke-width":1.5}));
      rg.appendChild(el("circle",{cx:0,cy:0,r:11,fill:"none",stroke:C[E[n].s],"stroke-width":1.2,"stroke-opacity":0.55}));
      DT.appendChild(rg);
      var fl=E[n].fl||[E[n].s],of=E[n].fo||FO[E[n].f]||[12,-8],ox=0;
      var tot=0;for(var q=0;q<fl.length;q++)tot+=flag(fl[q]).w+4;
      var gx=f[0]+K*(of[0]<0?of[0]-(tot-28):of[0]),gy=f[1]+K*of[1];
      if(fl.length)DT.appendChild(el("line",{x1:f[0],y1:f[1],
        x2:of[0]<0?gx+K*(tot-4):gx,y2:gy+7*K,
        stroke:C[E[n].s],"stroke-width":0.8*K,"stroke-dasharray":(2*K)+" "+(2*K)}));
      for(var q2=0;q2<fl.length;q2++){
        var fd=flag(fl[q2]),nd=flagNode(fl[q2]);
        nd.setAttribute("transform","translate("+(gx+ox)+","+gy+") scale("+K+")");
        DT.appendChild(nd);ox+=K*(fd.w+4);
      }
      var ic=E[n].ic||["ship"];
      if(ic[0]==="ship"&&legs.length){
        legs.forEach(function(lg){
          var m;
          try{var L=lg[0].getTotalLength();var q=lg[0].getPointAtLength(L*0.5);m=[q.x,q.y]}
          catch(err){m=mid(P[lg[1][0]],P[lg[1][1]])}
          putIcon("ship",m[0],m[1],C[lg[1][2]]);
        });
      }else{
        for(var q4=0;q4<ic.length;q4++)putIcon(ic[q4],f[0]+q4*22*K,f[1]+18*K,C[E[n].s]);
      }
    }
  }
  var ev=E[i];
  document.getElementById("date").textContent=ev.d;
  var sd=document.getElementById("side");
  sd.textContent=ev.n||NAME[ev.s];sd.style.color=C[ev.s];
  var pfl=ev.fl||[ev.s],pb=document.getElementById("pflag"),ph="";
  for(var q3=0;q3<pfl.length;q3++){var pf=flag(pfl[q3]);
    ph+='<svg width="'+(pf.w*0.9)+'" height="'+(pf.h*0.9)+'" viewBox="0 0 '+pf.w+' '+pf.h+'" style="margin-right:5px">'+pf.m+'</svg>';}
  pb.innerHTML=ph;
  for(var nd2=0;nd2<ND.length;nd2++){
    var def=ND[nd2],btn=document.getElementById(def.b);
    btn.hidden=!ev[def.k];
    if(!btn.hidden&&!btn.firstChild.innerHTML){var ff=flag(def.k);
      btn.firstChild.innerHTML='<svg width="18" height="'+(18*ff.h/ff.w).toFixed(1)+'" viewBox="0 0 '+ff.w+' '+ff.h+'">'+ff.m+'</svg>';}
    btn.setAttribute("aria-expanded","false");
  }
  POP.hidden=true;
  document.getElementById("txt").textContent=ev.t;
  SL.value=i;
  for(var j=0;j<LB.length;j++)LB[j].setAttribute("aria-current",j===i?"true":"false");
  reveal(LB[i]);
}
function go(n){i=Math.max(0,Math.min(E.length-1,n));draw()}
function stop(){if(timer){clearInterval(timer);timer=null;document.getElementById("pi").innerHTML="&#9654;"}}

document.getElementById("next").onclick=function(){stop();go(i+1)};
document.getElementById("prev").onclick=function(){stop();go(i-1)};
SL.oninput=function(){stop();go(+this.value)};
document.getElementById("play").onclick=function(){
  if(timer){stop();return}
  if(i>=E.length-1)i=0;
  document.getElementById("pi").innerHTML="&#10074;&#10074;";
  timer=setInterval(function(){if(i>=E.length-1){stop();return}go(i+1)},1900);
  draw();
};
function closePop(){POP.hidden=true;POP.dataset.pin="0";
  for(var n=0;n<ND.length;n++)document.getElementById(ND[n].b).setAttribute("aria-expanded","false")}
function openPop(def){
  document.getElementById("popttl").textContent=def.t;
  document.getElementById("uktxt").textContent=E[i][def.k]||"";
  POP.className=def.k==="ar"?"arn":"";
  POP.hidden=false;POP.dataset.side=def.k;
  for(var n=0;n<ND.length;n++)document.getElementById(ND[n].b)
    .setAttribute("aria-expanded",ND[n].k===def.k?"true":"false");
}
ND.forEach(function(def){
  var b=document.getElementById(def.b);
  b.addEventListener("mouseenter",function(){openPop(def)});
  b.addEventListener("mouseleave",function(){if(POP.dataset.pin!=="1")closePop()});
  b.addEventListener("focus",function(){openPop(def)});
  b.addEventListener("blur",function(){closePop()});
  b.addEventListener("click",function(){
    if(POP.dataset.pin==="1"&&POP.dataset.side===def.k){closePop();return}
    openPop(def);POP.dataset.pin="1";
  });
});
POP.addEventListener("click",closePop);
document.addEventListener("keydown",function(e){
  if(e.key==="Escape")closePop();
  if(e.key==="ArrowRight"){stop();go(i+1)}
  else if(e.key==="ArrowLeft"){stop();go(i-1)}
});
var x0=null;
var ch=document.getElementById("chart");
ch.addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
ch.addEventListener("touchend",function(e){
  if(x0===null)return;
  var dx=e.changedTouches[0].clientX-x0;x0=null;
  if(Math.abs(dx)<40)return;
  stop();go(dx<0?i+1:i-1);
},{passive:true});

draw();
})();
</script>
</body>
</html>
