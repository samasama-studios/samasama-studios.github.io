<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Resilience (Dev)</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      /* The game is designed for a 9:16 portrait phone: keep that shape at any window size, as large as it fits. */
      #unity-container { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); aspect-ratio: 9 / 16; width: min(100vw, 100vh * 9 / 16); width: min(100vw, 100dvh * 9 / 16); }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #000; touch-action: none; }
      #unity-loading-bar { position: absolute; left: 20%; right: 20%; top: 50%; height: 6px; background: #444; display: none; }
      #unity-progress-bar-full { width: 0%; height: 100%; background: #ddd; }
      #unity-warning { position: absolute; left: 50%; top: 5%; transform: translate(-50%); background: white; padding: 10px; display: none; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/resilience.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/resilience.data.unityweb",
        frameworkUrl: buildUrl + "/resilience.framework.js.unityweb",
        codeUrl: buildUrl + "/resilience.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Sama Sama Studios",
        productName: "Resilience (Dev)",
        productVersion: "0.1.4",
        showBanner: unityShowBanner,
        // Always render at the 1080x1920 set on the canvas, so the game sees the same phone screen
        // whatever the size of the browser window. CSS scales it to fit.
        matchWebGLToCanvasSize: false,
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
