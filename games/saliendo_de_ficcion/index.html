<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saliendo de Ficción</title>
  <!-- Open on black (see Opening in style.css and script.js), set before anything paints. Without
       JavaScript the class is never set, so the scene shows as usual. Coming from the band site
       (once per session), the progress bar first takes over from the site's own bar. -->
  <script>
    (() => {
      const root = document.documentElement;
      root.classList.add('is-opening');
      try {
        if (document.referrer.startsWith('https://araukaaria.ee') && !sessionStorage.getItem('saliendo-handoff')) {
          sessionStorage.setItem('saliendo-handoff', '1');
          root.classList.add('is-handoff');
        }
      } catch {}
      // In case script.js never gets there (it fails to load, or throws), don't stay black
      setTimeout(() => root.classList.remove('is-opening', 'is-handoff'), 4000);
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Progress bar along the top: the scene's steps -->
  <div class="progress">
    <div class="bar bar-level" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuenow="0"><span class="bar-fill"></span></div>
  </div>

  <main class="stage">
    <!-- Each tappable object carries a collider: an SVG of its visible shape (assets/colliders, made by
         tools/trace-colliders.mjs), inside the object so it moves with it. Only the colliders take
         taps, and each step only advances from its own object (see STEPS in script.js). -->
    <img class="layer-floor" src="assets/sprites/floor.png" alt="" aria-hidden="true">
    <svg class="collider collider-floor" viewBox="0 0 2160 2160" aria-hidden="true"><use href="assets/colliders/floor.svg#floor"/></svg>
    <!-- The particles: shown twice, each copy clipped to one of the image's two clusters, so each
         cluster can float up and down on its own (see .particles-left / .particles-right in style.css). -->
    <div class="layer-particles" aria-hidden="true">
      <img class="particles-left" src="assets/sprites/particles.png" alt="">
      <img class="particles-right" src="assets/sprites/particles.png" alt="">
    </div>
    <!-- The riser starts the character low, sitting in the grass, and lifts it to its original
         position; the levitator inside floats it once it's there. -->
    <div class="riser">
      <div class="levitator">
        <!-- The aura, behind the character. Loaded up front (but invisible) so it's ready to fade in
             the moment the character starts to rise -->
        <img class="layer-particular-aura" src="assets/sprites/particular_aura.png" alt="" aria-hidden="true">
        <img class="layer-foreground" src="assets/sprites/particular.webp" alt="Meditating character">
        <!-- The spiral above the head: not loaded up front; fades in on a later tap -->
        <img class="layer-aura" data-src="assets/sprites/sun_ray.webp" alt="" aria-hidden="true">
        <svg class="collider" viewBox="0 0 2160 2160" aria-hidden="true"><use href="assets/colliders/particular.svg#particular"/></svg>
      </div>
    </div>
    <!-- Mushrooms along the bottom, in front of the character: not loaded up front; they slide up
         from below on a later tap. Grouped with their lit version, which fades in on the tap after. -->
    <div class="layer-slide layer-shrooms" aria-hidden="true">
      <img data-src="assets/sprites/shrooms.png" alt="">
      <img class="layer-light" data-src="assets/sprites/shrooms_light.png" alt="">
      <svg class="collider" viewBox="0 0 2160 2160"><use href="assets/colliders/shrooms.svg#shrooms"/></svg>
    </div>
    <!-- Plant images are shown several times: each copy is clipped to one plant (see style.css). -->
    <!-- Side leaves, behind the side plants: not loaded up front; they slide in from the sides once
         the spiral appears above the character's head. Not tappable, so no collider. -->
    <img class="layer-slide leaves-sides leaves-left" data-src="assets/sprites/plants_leaves_sides.png" alt="" aria-hidden="true">
    <img class="layer-slide leaves-sides leaves-right" data-src="assets/sprites/plants_leaves_sides.png" alt="" aria-hidden="true">
    <!-- Side plants: the right one slides partway in a second after load (.is-peeking: its tip
         showing) to be pulled in the rest of the way; the left one comes in on the next tap.
         Each one is grouped with its lit version so the light moves with the plant; the light isn't
         loaded up front and fades in on a later tap. -->
    <div class="layer-slide plants-sides plant-left" aria-hidden="true">
      <img src="assets/sprites/plants_sides.png" alt="">
      <img class="layer-light" data-src="assets/sprites/plants_sides_light.png" alt="">
      <svg class="collider" viewBox="0 0 2160 2160"><use href="assets/colliders/plants_sides.svg#plants_sides"/></svg>
    </div>
    <div class="layer-slide plants-sides plant-right is-peeking" aria-hidden="true">
      <img src="assets/sprites/plants_sides.png" alt="">
      <img class="layer-light" data-src="assets/sprites/plants_sides_light.png" alt="">
      <svg class="collider" viewBox="0 0 2160 2160"><use href="assets/colliders/plants_sides.svg#plants_sides"/></svg>
    </div>
    <!-- Corner plants: not loaded up front; script.js sets src from data-src when they come in.
         Each one is grouped with its glow (just the light round its bulb), which is loaded and faded
         in on a later tap. The glow comes first so it sits behind the plant, shining through the
         bulb's ring. -->
    <div class="layer-slide plants-corner plant-top-left" aria-hidden="true">
      <img class="layer-light" data-src="assets/sprites/plants_corners_light.png" alt="">
      <img data-src="assets/sprites/plants_corner.png" alt="">
      <svg class="collider" viewBox="0 0 2160 2160"><use href="assets/colliders/plants_corner.svg#plants_corner"/></svg>
    </div>
    <div class="layer-slide plants-corner plant-top-right" aria-hidden="true">
      <img class="layer-light" data-src="assets/sprites/plants_corners_light.png" alt="">
      <img data-src="assets/sprites/plants_corner.png" alt="">
      <svg class="collider" viewBox="0 0 2160 2160"><use href="assets/colliders/plants_corner.svg#plants_corner"/></svg>
    </div>
    <div class="layer-slide plants-corner plant-bottom-left" aria-hidden="true">
      <img class="layer-light" data-src="assets/sprites/plants_corners_light.png" alt="">
      <img data-src="assets/sprites/plants_corner.png" alt="">
      <svg class="collider" viewBox="0 0 2160 2160"><use href="assets/colliders/plants_corner.svg#plants_corner"/></svg>
    </div>
    <div class="layer-slide plants-corner plant-bottom-right" aria-hidden="true">
      <img class="layer-light" data-src="assets/sprites/plants_corners_light.png" alt="">
      <img data-src="assets/sprites/plants_corner.png" alt="">
      <svg class="collider" viewBox="0 0 2160 2160"><use href="assets/colliders/plants_corner.svg#plants_corner"/></svg>
    </div>
    <!-- The sun's ray: the aura strand (sun_ray.webp), which hangs from the sun, rebuilt from slices so
         it can reach any length. Hidden until the player picks it up from the sun to light the
         corner plants (see "Sun ray" in script.js, which fills it in). -->
    <div class="layer-ray" aria-hidden="true"></div>
    <!-- The sun, slowly turning. Its image is cut off at the top edge, so the disc is completed with
         a turned copy of itself (see .sun in style.css). -->
    <div class="sun" aria-hidden="true">
      <img class="layer-sun" src="assets/sprites/sun.webp" alt="">
      <img class="layer-sun layer-sun-copy" src="assets/sprites/sun.webp" alt="">
    </div>
    <svg class="collider collider-sun" viewBox="0 0 2160 2160" aria-hidden="true"><use href="assets/colliders/sun.svg#sun"/></svg>
  </main>

  <!-- Bottom dock: where the music is in its loop, above the sound controls (same width).
       Taps on the controls don't advance the scene (see script.js). -->
  <div class="dock">
    <div class="bar bar-loop" aria-hidden="true"><span class="bar-fill"></span></div>
    <div class="controls" role="group" aria-label="Sound">
      <button class="mute" type="button" aria-label="Mute" aria-pressed="false" aria-keyshortcuts="M" title="Mute (M)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="speaker" d="M4 9h4l5-4v14l-5-4H4z" />
          <g class="icon-on"><path d="M16 8.5a4.5 4.5 0 0 1 0 7" /><path d="M18.5 6a8 8 0 0 1 0 12" /></g>
          <g class="icon-off"><path d="M16.5 9.5l5 5" /><path d="M21.5 9.5l-5 5" /></g>
        </svg>
      </button>
      <input class="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>
  </div>

  <script src="audio.js"></script>
  <script src="script.js"></script>
</body>
</html>
